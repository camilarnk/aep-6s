<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faunifica</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Faunifica 🐦</h1>
    <p>Cadastro e consulta de espécies silvestres.</p>
</header>

<main>

    <section class="acoes">
        <input type="text" id="campoBusca" placeholder="Buscar espécie por nome popular...">
        <button id="botaoNovaEspecie">+ Nova espécie</button>
    </section>

    <section class="filtros">
        <select id="filtroGrupo">
            <option value="" selected disabled>Grupo</option>
        </select>

        <select id="filtroBioma">
            <option value="" selected disabled>Bioma</option>
        </select>

        <select id="filtroRisco">
            <option value="" selected disabled>Nível de risco</option>
        </select>
    </section>

    <section class="lista-especies">
        <table>
            <thead>
                <tr>
                    <th>Nome popular</th>
                    <th>Bioma</th>
                    <th>Grupo</th>
                    <th>Nível de risco</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabelaEspecies">
            </tbody>
        </table>
    </section>

</main>

<div id="modalNovaEspecie" class="modal">
    <div class="modal-conteudo">

        <button class="botao-fechar" id="botaoFecharModal">&times;</button>
        <h2>Nova espécie</h2>
        <p>Preencha as informações da espécie.</p>

        <form id="formNovaEspecie">

            <div class="campo">
                <label for="nomePopular">Nome popular</label>
                <input type="text" id="nomePopular" name="nomePopular" required>
            </div>

            <div class="campo">
                <label for="nomeCientifico">Nome científico</label>
                <input type="text" id="nomeCientifico" name="nomeCientifico" required>
            </div>

            <div class="campo">
                <label for="grupo">Grupo</label>
                <select id="grupo" name="grupo" required>
                    <option value="" selected disabled>Selecione o grupo</option>
                    <option value="AVE">Ave</option>
                    <option value="MAMIFERO">Mamífero</option>
                    <option value="REPTIL">Réptil</option>
                    <option value="ANFIBIO">Anfíbio</option>
                    <option value="PEIXE">Peixe</option>
                </select>
            </div>

            <div class="campo">
                <label for="bioma">Bioma</label>
                <select id="bioma" name="bioma" required>
                    <option value="" selected disabled>Selecione o bioma</option>
                    <option value="AMAZONIA">Amazônia</option>
                    <option value="CAATINGA">Caatinga</option>
                    <option value="CERRADO">Cerrado</option>
                    <option value="MATA_ATLANTICA">Mata Atlântica</option>
                    <option value="PAMPA">Pampa</option>
                    <option value="PANTANAL">Pantanal</option>
                </select>
            </div>

            <div class="campo">
                <label for="nivelRisco">Nível de risco</label>
                <select id="nivelRisco" name="nivelRisco" required>
                    <option value="" selected disabled>Selecione o nível de risco</option>
                    <option value="CRITICO">Crítico</option>
                    <option value="ALTO">Alto</option>
                    <option value="MODERADO">Moderado</option>
                    <option value="BAIXO">Baixo</option>
                </select>
            </div>

            <div class="campo">
                <label for="populacaoEstimada">População estimada</label>
                <input type="number" id="populacaoEstimada" name="populacaoEstimada" min="0" required>
            </div>

            <button type="submit" class="botao-cadastrar">
                Cadastrar espécie
            </button>

        </form>

    </div>
</div>

<div id="modalVerEspecie" class="modal">
    <div class="modal-conteudo">

        <button class="botao-fechar" id="botaoFecharVerEspecie">&times;</button>

        <h2 id="tituloVerEspecie">Detalhes da espécie</h2>
        <p id="subtituloVerEspecie">Informações cadastradas.</p>

        <div id="dadosEspecie">

            <div class="campo">
                <label for="verNomePopular">Nome popular</label>
                <input type="text" id="verNomePopular" readonly>
            </div>

            <div class="campo">
                <label for="verNomeCientifico">Nome científico</label>
                <input type="text" id="verNomeCientifico" readonly>
            </div>

            <div class="campo">
                <label for="verGrupo">Grupo</label>
                <select id="verGrupo" disabled>
                    <option value="AVE">Ave</option>
                    <option value="MAMIFERO">Mamífero</option>
                    <option value="REPTIL">Réptil</option>
                    <option value="ANFIBIO">Anfíbio</option>
                    <option value="PEIXE">Peixe</option>
                </select>
            </div>

            <div class="campo">
                <label for="verBioma">Bioma</label>
                <select id="verBioma" disabled>
                    <option value="AMAZONIA">Amazônia</option>
                    <option value="CAATINGA">Caatinga</option>
                    <option value="CERRADO">Cerrado</option>
                    <option value="MATA_ATLANTICA">Mata Atlântica</option>
                    <option value="PAMPA">Pampa</option>
                    <option value="PANTANAL">Pantanal</option>
                </select>
            </div>

            <div class="campo">
                <label for="verNivelRisco">Nível de risco</label>
                <select id="verNivelRisco" disabled>
                    <option value="CRITICO">Crítico</option>
                    <option value="ALTO">Alto</option>
                    <option value="MODERADO">Moderado</option>
                    <option value="BAIXO">Baixo</option>
                </select>
            </div>

            <div class="campo">
                <label for="verPopulacaoEstimada">População estimada</label>
                <input type="number" id="verPopulacaoEstimada" min="0" readonly>
            </div>

        </div>

        <div class="acoes-modal">

            <button type="button" id="botaoAtualizar" class="botao-atualizar">
                Atualizar
            </button>

            <button type="button" id="botaoDeletar" class="botao-deletar">
                Deletar
            </button>

        </div>

    </div>
</div>

<script src="js/script.js"></script>

</body>

</html>
