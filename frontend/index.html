<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faunifica</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Faunifica 🐦</h1>
    <p>Cadastro e consulta de espécies silvestres.</p>
</header>

<main>

    <section class="acoes">
        <input type="text" id="campoBusca" placeholder="Buscar espécie por nome popular...">
        <button id="botaoNovaEspecie">+ Nova espécie</button>
    </section>

    <section class="filtros">
        <select id="filtroGrupo">
            <option value="" selected disabled>Grupo</option>
        </select>

        <select id="filtroBioma">
            <option value="" selected disabled>Bioma</option>
        </select>

        <select id="filtroRisco">
            <option value="" selected disabled>Nível de risco</option>
        </select>
    </section>

    <section class="lista-especies">
        <table>
            <thead>
                <tr>
                    <th>Nome popular</th>
                    <th>Bioma</th>
                    <th>Grupo</th>
                    <th>Nível de risco</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Ararinha-Azul</td>
                    <td>Amazônia</td>
                    <td>Ave</td>
                    <td> <span class="risco">Crítico</span> </td>
                    <td> <button class="botao-ver-mais">Ver mais</button> </td>
                </tr>

                <tr>
                    <td>Onça-pintada</td>
                    <td>Amazônia</td>
                    <td>Mamífero</td>
                    <td> <span class="risco">Alto</span> </td>
                    <td> <button class="botao-ver-mais">Ver mais</button> </td>
                </tr>
            </tbody>
        </table>
    </section>

</main>

<script src="js/script.js"></script>

</body>

</html>
